<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Quince Años</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f6;--card:#ffffff;--text:#3a1418;--muted:#8a5a60;--accent:#a50f20;--accent2:#f2c6ca;--line:#f0d0d3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0d11;--card:#3a1419;--text:#fdeaea;--muted:#d0a0a6;--accent:#d93a4b;--accent2:#7a1f2b;--line:#5a2530}}
:root[data-theme="dark"]{--bg:#2a0d11;--card:#3a1419;--text:#fdeaea;--muted:#d0a0a6;--accent:#d93a4b;--accent2:#7a1f2b;--line:#5a2530}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Jost,system-ui,sans-serif;line-height:1.6;text-align:center}
.hero{padding:72px 20px 56px;background:#8b0f1d;border-bottom:4px solid #d4af37}
.kicker{letter-spacing:.3em;text-transform:uppercase;font-size:.8rem;color:#f0d58a}
h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(3rem,13vw,5.5rem);margin:.2em 0;color:#fff;line-height:1.05}
.sub{font-size:1.15rem;color:#fff}
section{max-width:620px;margin:0 auto;padding:36px 20px}
h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:1.8rem;margin:0 0 .6em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:12px 0}
.big{font-size:1.25rem;font-weight:500}
.muted{color:var(--muted)}
#count{font-family:'Playfair Display',Georgia,serif;font-size:2rem;color:var(--accent)}
label{display:block;text-align:left;font-size:.9rem;margin:14px 0 4px;color:var(--muted)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.btn{display:inline-block;margin-top:20px;padding:14px 32px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.6}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#msg{margin-top:14px;min-height:1.4em}
footer{padding:30px 20px 50px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<header class="hero">
  <div class="kicker">You're invited to celebrate</div>
  <h1 id="name"></h1>
  <div class="sub">Mis Quince Años</div>
</header>

<section>
  <div id="count"></div>
  <div class="muted" id="countlabel"></div>
</section>

<section>
  <h2>The Details</h2>
  <div class="card"><div class="big" id="date"></div><div class="muted" id="time"></div></div>
  <div class="card"><div class="big" id="venue"></div><div class="muted" id="addr"></div>
    <a class="btn" id="map" target="_blank" rel="noopener">Get Directions</a></div>
  <div class="card"><div class="big">Dress Code</div><div class="muted" id="dress"></div></div>
</section>

<section id="rsvpSec">
  <h2>RSVP</h2>
  <div class="card">
    <div class="muted" id="deadline"></div>
    <label for="gname">Your name</label>
    <input id="gname" maxlength="80" autocomplete="name">
    <label>Will you join us?</label>
    <div class="seg"><button type="button" data-v="yes">Joyfully accept</button><button type="button" data-v="no">Regretfully decline</button></div>
    <div id="more">
      <label for="party">Number of guests (including you)</label>
      <select id="party"></select>
      <label for="diet">Food allergies or dietary needs</label>
      <input id="diet" maxlength="120">
    </div>
    <label for="note">Message for the quinceañera (optional)</label>
    <textarea id="note" rows="3" maxlength="300"></textarea>
    <button class="btn" id="send" type="button">Send RSVP</button>
    <div id="msg" role="status"></div>
  </div>
</section>

<section id="donateSec">
  <h2>A Gift</h2>
  <div class="card"><p class="muted" id="donateText"></p><a class="btn" id="donateLink" target="_blank" rel="noopener">Contribute</a></div>
</section>

<footer>With love, <span id="fam"></span> ♡</footer>

<script>
// ===== EDIT THESE DETAILS =====
const INFO = {
  name: "Luceli Frausto",
  dateISO: "2027-11-20T17:00:00",
  dateText: "Saturday, November 20, 2027",
  timeText: "Time to be announced",
  venue: "Venue to be announced",
  address: "",
  dress: "Formal",
  rsvpBy: "",
  family: "The Frausto Family",
  sheetUrl: "https://script.google.com/macros/s/AKfycbyrqSweJq4VGX-RqVOLx9FZKXP4jMnWBQdZFeaLpHfQi8G7H5R69cj2WLFv_t1MqQlO/exec",   // paste your Google Apps Script web app URL here (RSVPs go to your Google Sheet)
  rsvpPhone: "+14805550123",  // RSVPs arrive as a text; leave "" to use email instead
  rsvpEmail: "family@example.com",
  donateUrl: "",   // paste a link (Venmo, GoFundMe...) to show a gift section
  donateText: "Your presence is the best gift. If you'd like to contribute toward her special day, you can do so here."
};
// ==============================
const $ = id => document.getElementById(id);
$('name').textContent = INFO.name; $('date').textContent = INFO.dateText; $('time').textContent = INFO.timeText;
$('venue').textContent = INFO.venue; $('addr').textContent = INFO.address; $('dress').textContent = INFO.dress;
$('deadline').textContent = INFO.rsvpBy; $('fam').textContent = INFO.family;
if (!INFO.address) $('map').style.display = 'none';
$('map').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(INFO.address);
$('donateText').textContent = INFO.donateUrl ? INFO.donateText : 'Gift details coming soon.';
if (INFO.donateUrl) $('donateLink').href = INFO.donateUrl; else $('donateLink').style.display = 'none';
document.title = INFO.name + "’s Quinceañera";
for (let i = 1; i <= 6; i++) { const o = document.createElement('option'); o.value = i; o.textContent = i; $('party').appendChild(o); }

const days = Math.ceil((new Date(INFO.dateISO) - new Date()) / 864e5);
$('count').textContent = days > 0 ? days : '🎉';
$('countlabel').textContent = days > 0 ? 'days to go' : 'Let’s celebrate!';

let answer = null;
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  answer = b.dataset.v;
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  $('more').style.display = answer === 'yes' ? '' : 'none';
});

$('send').onclick = async () => {
  const msg = $('msg'), name = $('gname').value.trim();
  if (!name) { msg.textContent = 'Please enter your name.'; return; }
  if (!answer) { msg.textContent = 'Please choose yes or no.'; return; }
  const yes = answer === 'yes';
  const data = { name, attending: yes ? 'Yes' : 'No', party: yes ? +$('party').value : 0,
    diet: yes ? $('diet').value.trim() : '', note: $('note').value.trim() };
  if (INFO.sheetUrl) {
    $('send').disabled = true;
    try {
      await fetch(INFO.sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
      msg.textContent = yes ? 'Thank you! We can’t wait to celebrate with you. ♡' : 'Thank you for letting us know. You’ll be missed! ♡';
    } catch (e) {
      $('send').disabled = false;
      msg.textContent = 'Sorry, something went wrong. Please try again.';
    }
    return;
  }
  const lines = [INFO.name + ' Quinceañera RSVP', 'Name: ' + name, yes ? 'Attending: Yes, ' + data.party + ' guest(s)' : 'Attending: No'];
  if (data.diet) lines.push('Dietary needs: ' + data.diet);
  if (data.note) lines.push('Message: ' + data.note);
  const body = encodeURIComponent(lines.join('\n'));
  if (INFO.rsvpPhone) location.href = 'sms:' + INFO.rsvpPhone + '?&body=' + body;
  else location.href = 'mailto:' + INFO.rsvpEmail + '?subject=' + encodeURIComponent(INFO.name + ' RSVP') + '&body=' + body;
  msg.textContent = 'Your messaging app should open. Just press send to confirm your RSVP!';
};
</script>
</body>
</html>
