<style>
:root{--bg:#ffffff;--card:#fafafa;--text:#111111;--muted:#666666;--accent:#111111;--onaccent:#ffffff;--line:#dddddd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--card:#161616;--text:#f5f5f5;--muted:#a0a0a0;--accent:#f5f5f5;--onaccent:#0b0b0b;--line:#333333}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#161616;--text:#f5f5f5;--muted:#a0a0a0;--accent:#f5f5f5;--onaccent:#0b0b0b;--line:#333333}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Jost,system-ui,sans-serif;line-height:1.7;text-align:center}
.header img{display:block;width:100%;height:auto}
section{max-width:620px;margin:0 auto;padding:30px 20px}
h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:1.8rem;margin:0 0 .5em}
.cd{display:flex;gap:10px;justify-content:center}
.cd div{flex:1;max-width:100px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px}
.cd b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:2rem;font-weight:500;line-height:1.1}
.cd span{font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.label{letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;color:var(--muted);margin-top:10px}
.msg-big{font-family:'Playfair Display',Georgia,serif;font-size:1.35rem;font-style:italic;line-height:1.6}
.date{font-family:'Playfair Display',Georgia,serif;font-size:2rem;margin:0}
.place{font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);max-width:80px;margin:8px auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:16px 0;text-align:left}
label{display:block;font-size:.9rem;margin:14px 0 4px;color:var(--muted)}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}
@media(max-width:480px){.row{flex-direction:column;gap:0}}
.btn{display:block;width:100%;margin-top:22px;padding:14px;border:0;border-radius:999px;background:var(--accent);color:var(--onaccent);font:inherit;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn:disabled{opacity:.6}
#msg{margin-top:14px;min-height:1.4em;text-align:center}
footer{padding:20px 20px 50px;color:var(--muted);font-size:.9rem}
</style>

<section>
  <div id="cd" class="cd"></div>
  <div class="label" id="countlabel"></div>
</section>

<section>
  <p class="msg-big">We are grateful for your presence as we celebrate this special milestone.<br>Please save the date for Luceli’s quinceañera celebration!</p>
</section>

<section>
  <hr>
  <p class="date" id="date"></p>
  <p class="place" id="place"></p>
  <hr>
</section>

<section>
  <p class="msg-big">Formal invitation to follow soon.<br>Please provide your current mailing address.</p>
  <div class="card" id="formCard">
    <label for="name">Name</label>
    <input id="name" maxlength="100" autocomplete="name">
    <label for="street1">Street Address 1</label>
    <input id="street1" maxlength="120" autocomplete="address-line1">
    <label for="street2">Street Address 2 <span>(optional)</span></label>
    <input id="street2" maxlength="120" autocomplete="address-line2">
    <label for="city">City</label>
    <input id="city" maxlength="80" autocomplete="address-level2">
    <div class="row">
      <div><label for="state">State / Province</label><input id="state" maxlength="60" autocomplete="address-level1"></div>
      <div><label for="zip">Zip / Postal Code</label><input id="zip" maxlength="20" autocomplete="postal-code"></div>
    </div>
    <label for="country">Country</label>
    <input id="country" maxlength="60" autocomplete="country-name">
    <label for="note">Message to Luceli <span>(optional)</span></label>
    <textarea id="note" rows="4" maxlength="400"></textarea>
    <button class="btn" id="send" type="button">Submit</button>
    <div id="msg" role="status"></div>
  </div>
</section>

<footer>With love, <span id="fam"></span> ♡</footer>

<script>
// ===== EDIT THESE DETAILS =====
const INFO = {
  dateISO: "2027-11-20T17:00:00",
  dateText: "Saturday, November 20, 2027",
  place: "Chandler, Arizona",
  family: "The Frausto Family",
  sheetUrl: "https://script.google.com/macros/s/AKfycbyrqSweJq4VGX-RqVOLx9FZKXP4jMnWBQdZFeaLpHfQi8G7H5R69cj2WLFv_t1MqQlO/exec"
};
// ==============================
const $ = id => document.getElementById(id);
$('date').textContent = INFO.dateText; $('place').textContent = INFO.place; $('fam').textContent = INFO.family;

const target = new Date(INFO.dateISO);
function tick() {
  const ms = target - new Date();
  if (ms <= 0) { $('cd').style.display = 'none'; $('countlabel').textContent = 'Let’s celebrate!'; return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  $('cd').innerHTML = [[d,'Days'],[h,'Hours'],[m,'Min'],[s,'Sec']].map(x => '<div><b>' + x[0] + '</b><span>' + x[1] + '</span></div>').join('');
  $('countlabel').textContent = 'until we celebrate';
}
tick(); setInterval(tick, 1000);

$('send').onclick = async () => {
  const msg = $('msg'), v = id => $(id).value.trim();
  const required = ['name','street1','city','state','zip','country'];
  if (required.some(id => !v(id))) { msg.textContent = 'Please fill in all required fields.'; return; }
  const data = { name: v('name'), street1: v('street1'), street2: v('street2'), city: v('city'),
    state: v('state'), zip: v('zip'), country: v('country'), note: v('note') };
  $('send').disabled = true;
  try {
    await fetch(INFO.sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    $('formCard').innerHTML = '<p class="msg-big" style="text-align:center">Thank you, ' + data.name.replace(/[&<>"]/g, '') + '!<br>We’ll send your formal invitation soon. ♡</p>';
  } catch (e) {
    $('send').disabled = false;
    msg.textContent = 'Sorry, something went wrong. Please try again.';
  }
};
</script>
</body>
</html>
